<!DOCTYPE html>
<html lang="es">

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;

            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 40px;

            font-weight: bold;
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;

            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .btn:hover {
